[package]
name = "penumbra-sct"
version = {workspace = true}
edition = {workspace = true}

[features]
component = [
    "cnidarium",
    "cnidarium-component",
    "penumbra-proto/cnidarium",
    "penumbra-proto/rpc",
    "tonic",
]
default = ["std", "component", "rand", "decaf377/arkworks"]
std = ["ark-ff/std"]
docsrs = []
rand = [
    "rand_core",
    "dep:rand",
    "decaf377/rand",
    "decaf377-rdsa/rand",
    "penumbra-keys/rand",
    "penumbra-tct/rand",
]

[dependencies]
anyhow = {workspace = true}
ark-ff = {workspace = true, default-features = false}
ark-r1cs-std = {workspace = true, default-features = false}
ark-relations = {workspace = true}
ark-serialize = {workspace = true}
async-trait = {workspace = true}
bincode = {workspace = true}
blake2b_simd = {workspace = true}
bytes = {workspace = true}
cnidarium = {workspace = true, optional = true, default-features = true}
cnidarium-component = {workspace = true, optional = true, default-features = true}
decaf377 = {workspace = true, features = ["r1cs"]}
decaf377-rdsa = {workspace = true}
hex = {workspace = true}
im = {workspace = true}
metrics = {workspace = true}
once_cell = {workspace = true}
pbjson-types = {workspace = true}
penumbra-keys = {workspace = true, default-features = false}
penumbra-proto = {workspace = true, default-features = false}
penumbra-tct = {workspace = true}
poseidon377 = {workspace = true, features = ["r1cs"]}
rand = {workspace = true, optional = true}
rand_core = {workspace = true, features = ["getrandom"], optional = true}
serde = {workspace = true, features = ["derive"]}
tendermint = {workspace = true}
tonic = {workspace = true, optional = true}
tracing = {workspace = true}
chrono = { workspace = true, default-features = false, features = ["serde", "now"] }

[dev-dependencies]
getrandom = {workspace = true}
